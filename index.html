<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151a26">
<title>역사 인생게임 — 조선 인생실록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#151a26;overflow:hidden;touch-action:none;font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-user-select:none;user-select:none;color:#2b2218}
#wrap{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#1d2433;box-shadow:0 0 40px rgba(0,0,0,.5)}
#cv{position:absolute;left:0;top:0;width:960px;height:540px}
.hidden{display:none!important}
h1,h2,h3,.jua{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
/* HUD */
#hud{position:absolute;left:0;top:0;right:0;height:28px;display:flex;align-items:center;gap:8px;padding:0 8px;background:rgba(18,22,34,.9);color:#fff;font-size:13.5px;z-index:5;white-space:nowrap}
#hud .who{font-family:'Jua';font-size:15px;color:#ffe29a}
#hud .obj{flex:1;text-align:center;color:#bfe3ff;overflow:hidden;text-overflow:ellipsis}
#hud .chip{background:rgba(255,255,255,.12);border-radius:10px;padding:1px 7px}
#hud .chip b{color:#ffd76a;font-weight:700}
#hud button{background:#ffd76a;border:0;border-radius:6px;font-family:'Jua';font-size:14px;padding:1px 8px;cursor:pointer}
/* dialog */
#dlg{position:absolute;left:12px;right:12px;bottom:10px;min-height:132px;background:#fffaf0;border:4px solid #4a3a28;border-radius:14px;z-index:8;padding:16px 20px 14px 128px;box-shadow:0 6px 0 rgba(0,0,0,.25);cursor:pointer}
#dlg.narr{padding-left:22px;background:#f3ead6}
#dlg.narr #pcv,#dlg.narr .nm{display:none}
#pcv{position:absolute;left:14px;top:16px;width:96px;height:96px;border-radius:12px;background:#e9dcc0;border:3px solid #c9b48a}
#dlg .nm{position:absolute;top:-17px;left:120px;background:#4a3a28;color:#fff;font-family:'Jua';font-size:17px;padding:2px 14px;border-radius:8px}
#dlg .tx{font-size:21px;line-height:1.55;min-height:62px;white-space:pre-wrap}
#dlg .ch{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#dlg .cbtn{text-align:left;font-family:inherit;font-size:18px;padding:7px 12px;border-radius:10px;border:2px solid #8b6b3f;background:#fff3d6;cursor:pointer;color:#2b2218}
#dlg .cbtn:hover{background:#ffe2a3}
#dlg .cbtn b{display:inline-block;width:22px;height:22px;border-radius:50%;background:#8b6b3f;color:#fff;text-align:center;font-size:14px;line-height:22px;margin-right:6px}
#dlg .nx{position:absolute;right:16px;bottom:8px;font-size:14px;color:#8b6b3f;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
/* panel */
#panel{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:800px;max-height:500px;overflow:auto;background:#fbf6ea;border:4px solid #6b4f2a;border-radius:16px;padding:18px 22px;z-index:10;box-shadow:0 8px 0 rgba(0,0,0,.3);touch-action:pan-y}
#panel.small{width:460px;text-align:center}
#panel.title{width:520px;text-align:center;top:58%;background:rgba(251,246,234,.96)}
#panel h2{font-size:28px;color:#6b3f1f;margin-bottom:8px}
#panel p{font-size:18px;line-height:1.55;margin:6px 0}
#panel .hl{color:#c0392b}
.btn{font-family:'Jua';font-size:20px;padding:8px 22px;border-radius:12px;border:0;background:#d9613b;color:#fff;cursor:pointer;box-shadow:0 4px 0 #8f3a1f;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f3a1f}
.btn.sub{background:#5c7fa8;box-shadow:0 4px 0 #334e6e}
.btn.gray{background:#9a8f7e;box-shadow:0 4px 0 #635a4c}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;font-family:inherit;font-size:19px;padding:10px 14px;margin:7px 0;border-radius:12px;border:2px solid #b89a6a;background:#fff;cursor:pointer;color:#2b2218}
.opt:hover{background:#fff1d0}
.opt.ok{background:#d7f2cf;border-color:#3d9a3d}
.opt.bad{background:#f8d4d0;border-color:#c0392b}
.opt.on{background:#ffe2a3;border-color:#d9613b}
.fb{min-height:28px;color:#8f3a1f;font-weight:700}
.score{font-family:'Jua';font-size:64px;color:#d9613b}
.score small{font-size:24px}
/* card */
.card{background:linear-gradient(#fffdf6,#f3e6c6);border:3px solid #8b6b3f;border-radius:12px;padding:16px 20px;text-align:left;position:relative}
.card .yr{font-family:'Jua';color:#8b6b3f;font-size:18px}
.card h3{font-size:30px;color:#6b3f1f;margin:2px 0 8px}
.card p{font-size:19px}
.card .no{position:absolute;right:14px;top:10px;font-family:'Jua';color:#b89a6a}
/* hangul */
.hg{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:10px}
.hg .prev{width:130px;height:130px;border:4px solid #8b6b3f;border-radius:16px;background:#fff;font-size:92px;line-height:122px;text-align:center;font-family:'Jua'}
.hg .rows div{margin:6px 0;display:flex;align-items:center;gap:5px}
.hg .lab{width:46px;font-family:'Jua';color:#6b3f1f}
.jm{width:46px;height:44px;font-size:24px;border-radius:10px;border:2px solid #b89a6a;background:#fff;cursor:pointer;font-family:'Jua'}
.jm.on{background:#ffd76a;border-color:#d9613b}
.jm.w{width:64px;font-size:17px}
/* grid cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.tile{border:3px solid #b89a6a;border-radius:12px;background:#fff;padding:10px;cursor:pointer;min-height:86px;font-size:16px;line-height:1.35}
.tile b{display:block;font-family:'Jua';font-size:21px;color:#6b3f1f;margin-bottom:3px}
.tile.on{background:#ffe2a3;border-color:#d9613b}
.tile.ok{background:#d7f2cf;border-color:#3d9a3d}
.tile.bad{background:#f8d4d0;border-color:#c0392b}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.slot{min-height:62px;border:3px dashed #b89a6a;border-radius:10px;padding:6px;font-size:16px;background:#fff8e8;cursor:pointer;position:relative}
.slot i{position:absolute;left:6px;top:2px;font-style:normal;font-family:'Jua';color:#b89a6a;font-size:13px}
.slot span{display:block;margin-top:12px;font-family:'Jua';font-size:16px}
.slot.ok{border:3px solid #3d9a3d;background:#d7f2cf}.slot.bad{border:3px solid #c0392b;background:#f8d4d0}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pool button{font-family:'Jua';font-size:17px;padding:8px 12px;border-radius:10px;border:2px solid #8b6b3f;background:#fff3d6;cursor:pointer}
.stmt{font-size:22px;background:#fff;border:3px solid #b89a6a;border-radius:12px;padding:16px;margin:10px 0;min-height:80px}
.bars div{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:17px}
.bars .bar{flex:1;height:14px;background:#eadfc8;border-radius:8px;overflow:hidden}
.bars .bar i{display:block;height:100%;background:#d9613b;border-radius:8px}
table.bk{width:100%;border-collapse:collapse;font-size:17px;margin:6px 0}
table.bk td{padding:4px 8px;border-bottom:1px solid #e3d5b8}
table.bk td:last-child{text-align:right;font-family:'Jua'}
.mini{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px}
.mini span{font-size:13.5px;padding:3px 8px;border-radius:8px;background:#eadfc8;color:#9a8f7e}
.mini span.got{background:#ffd76a;color:#5a3a12}
input.nm{font-family:'Jua';font-size:24px;padding:6px 12px;border:3px solid #b89a6a;border-radius:10px;width:220px;text-align:center;-webkit-user-select:text;user-select:text}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 0 0 2px #b89a6a}
.sw.on{box-shadow:0 0 0 4px #d9613b}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:15px;margin:8px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
/* board bar */
#bbar{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:6}
#bbar .tip{color:#fff;font-size:15px;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:8px}
#die{width:52px;height:52px;border-radius:12px;background:#fff;border:3px solid #4a3a28;font-family:'Jua';font-size:34px;line-height:46px;text-align:center}
#toast{position:absolute;left:50%;top:40px;transform:translateX(-50%);background:rgba(30,30,30,.86);color:#ffe29a;font-family:'Jua';font-size:20px;padding:6px 18px;border-radius:20px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:30}
#ctitle{position:absolute;left:0;right:0;top:200px;text-align:center;font-family:'Jua';color:#fff;font-size:44px;text-shadow:0 3px 0 #000;z-index:31;pointer-events:none;opacity:0;transition:opacity .4s}
#ctitle small{display:block;font-size:24px;color:#ffe29a}
/* pad */
#pad{position:fixed;left:0;right:0;bottom:0;height:0;z-index:40;pointer-events:none}
#pad .dp{position:fixed;left:14px;bottom:14px;width:156px;height:156px;pointer-events:auto}
#pad .dp button{position:absolute;width:52px;height:52px;border-radius:12px;border:0;background:rgba(255,255,255,.55);font-size:22px;color:#333}
#pad .u{left:52px;top:0}#pad .d{left:52px;bottom:0}#pad .l{left:0;top:52px}#pad .r{right:0;top:52px}
#pad .a{position:fixed;right:18px;bottom:40px;width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,215,106,.85);font-family:'Jua';font-size:28px;pointer-events:auto;color:#4a3a28}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="bbar" class="hidden"><span class="tip">빨강·파랑·보라·금색 칸에서는 꼭 멈춰요</span><div id="die">?</div><button class="btn" id="roll">주사위 굴리기</button></div>
  <div id="dlg" class="hidden"><canvas id="pcv" width="96" height="96"></canvas><div class="nm"></div><div class="tx"></div><div class="ch"></div><div class="nx">▼</div></div>
  <div id="panel" class="hidden"></div>
  <div id="toast"></div>
  <div id="ctitle"></div>
  <div id="fade"></div>
</div></div>
<div id="pad" class="hidden"><div class="dp"><button class="u" data-d="up">▲</button><button class="l" data-d="left">◀</button><button class="r" data-d="right">▶</button><button class="d" data-d="down">▼</button></div><button class="a" id="padA">A</button></div>
<script>
'use strict';
/* ================= 기본 ================= */
const $=s=>document.querySelector(s);
const cv=$('#cv'),cx=cv.getContext('2d');
const STAGE=$('#stage'),HUD=$('#hud'),DLG=$('#dlg'),DTX=DLG.querySelector('.tx'),DNM=DLG.querySelector('.nm'),DCH=DLG.querySelector('.ch'),PCV=$('#pcv'),PCX=PCV.getContext('2d');
const PNL=$('#panel'),BBAR=$('#bbar'),FADE=$('#fade'),TOAST=$('#toast'),PAD=$('#pad'),CTITLE=$('#ctitle');
const W=960,H=540,T=32,COLS=30,ROWS=16,OY=28,KEY='joseonLifeV1';
const COARSE=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
let scene='title',fading=false,muted=false,AC=null,lastTS=0;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

function fit(){
  const WR=document.getElementById('wrap');const vw=WR.clientWidth||innerWidth,vh=WR.clientHeight||innerHeight,portrait=vh>vw;
  const padH=(COARSE&&portrait)?190:0;
  const s=Math.min(vw/W,(vh-padH)/H);
  STAGE.style.transform=`scale(${s})`;
  STAGE.style.left=((vw-W*s)/2)+'px';
  STAGE.style.top=(portrait&&COARSE?Math.max(0,(vh-padH-H*s)/2):(vh-H*s)/2)+'px';
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();setTimeout(fit,100);

function snd(type){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const P={blip:[900,.03,'square',.02],ok:[620,.28,'triangle',.14],no:[200,.3,'sawtooth',.07],dice:[420,.06,'square',.04],card:[523,.45,'triangle',.14],step:[260,.04,'square',.02]}[type];
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=P[2];o.frequency.setValueAtTime(P[0],t);
    if(type==='ok'||type==='card')o.frequency.linearRampToValueAtTime(P[0]*1.6,t+P[1]);
    if(type==='no')o.frequency.linearRampToValueAtTime(P[0]*.6,t+P[1]);
    g.gain.setValueAtTime(P[3],t);g.gain.exponentialRampToValueAtTime(.0001,t+P[1]);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+P[1]+.02);
  }catch(e){}
}
let toastT=null;
function toast(m){TOAST.textContent=m;TOAST.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>TOAST.classList.remove('on'),1600);}
function fade(cb){fading=true;FADE.style.opacity=1;setTimeout(()=>{cb();FADE.style.opacity=0;setTimeout(()=>{fading=false;},360);},380);}
function chapterTitle(a,b){CTITLE.innerHTML=`<small>${a}</small>${b}`;CTITLE.style.opacity=1;setTimeout(()=>CTITLE.style.opacity=0,1700);}

/* ================= 상태 ================= */
function newState(){return{v:1,name:'',gender:'boy',color:'#4f86c6',path:null,st:{용기:0,지혜:0,인정:0,곡식:3},pos:0,done:{},cards:[],miss:{},qc:0,qt:0,qs:0,asked:[],wrong:[],items:[],tl:0,fin:false};}
let S=newState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(KEY);}catch(e){}}
function eff(e){
  if(!e)return;const parts=[];
  for(const k in e){if(!e[k])continue;S.st[k]=Math.max(0,(S.st[k]||0)+e[k]);parts.push(`${k} ${e[k]>0?'+':''}${e[k]}`);}
  if(parts.length)toast(parts.join(' · '));hud();
}
const N=()=>S.name||'얘야';
const total=()=>{const m=Object.values(S.miss).reduce((a,b)=>a+b,0);return m+S.qs+S.tl*10+(S.st.용기+S.st.지혜+S.st.인정)*5;};

/* ================= 데이터: 실록 카드 ================= */
const CARDS={
 c1:{t:'훈민정음 창제',y:'1443년 · 1446년',d:'세종은 백성이 쉽게 글을 익히도록 훈민정음을 만들었다. 1443년에 만들고 1446년에 온 나라에 널리 알렸다.'},
 c2:{t:'임진왜란의 시작',y:'1592년 4월',d:'일본군이 부산에 상륙했다. 부산진성의 정발, 동래성의 송상현이 끝까지 성을 지켰지만 성은 함락되었고, 일본군은 한양으로 올라갔다. 선조는 북쪽으로 피란했다.'},
 c3:{t:'의병의 활약',y:'1592년',d:'나라가 위기에 빠지자 백성·선비·승려들이 스스로 의병을 일으켰다. 곽재우는 붉은 옷을 입고 고향 지리를 이용해 일본군을 물리쳐 ‘홍의장군’이라 불렸다.'},
 c4:{t:'한산도대첩',y:'1592년 7월',d:'이순신이 이끈 조선 수군은 좁은 견내량의 일본 수군을 넓은 한산도 앞바다로 끌어낸 뒤 학익진으로 크게 무찔렀다. 판옥선과 거북선이 활약했다.'},
 c5:{t:'행주대첩',y:'1593년 2월',d:'권율이 이끈 관군과 승병, 백성이 행주산성에서 힘을 모아 일본군을 크게 물리쳤다. 백성들이 돌을 날라 싸움을 도왔다고 전해진다.'},
 c6:{t:'정유재란과 명량해전',y:'1597년',d:'일본이 다시 쳐들어온 정유재란 때, 이순신은 남은 배 13척으로 명량의 좁고 빠른 물살을 이용해 훨씬 많은 일본 수군을 물리쳤다.'},
 c7:{t:'노량해전',y:'1598년',d:'물러가는 일본군과 노량 바다에서 마지막 큰 싸움이 벌어졌다. 이순신은 이 싸움에서 전사했고, 7년 동안의 전쟁이 끝났다.'},
 c8:{t:'광해군의 중립 외교',y:'1608년~1623년',d:'광해군은 전쟁으로 무너진 나라를 다시 세우고, 명과 새로 일어난 후금 사이에서 어느 한쪽 편만 들지 않는 외교를 펼쳤다.'},
 c9:{t:'『동의보감』 완성',y:'1610년',d:'허준은 아픈 백성을 위해 우리 땅에서 나는 약재와 치료법을 정리한 『동의보감』을 완성했다. 오늘날 유네스코 세계 기록 유산이다.'},
 c10:{t:'정묘호란',y:'1627년',d:'인조반정(1623)으로 왕이 된 인조는 명과 가까이하고 후금을 멀리했다. 1627년 후금이 쳐들어왔고, 조선은 후금과 형제 관계를 맺고 전쟁을 끝냈다.'},
 c11:{t:'병자호란',y:'1636년 12월',d:'후금은 나라 이름을 청으로 바꾸고 임금과 신하의 관계를 요구했다. 조선이 거절하자 청이 쳐들어왔고, 인조는 남한산성으로 피했다.'},
 c12:{t:'삼전도의 항복',y:'1637년 1월',d:'성안의 식량이 떨어지자 인조는 삼전도에서 청에 항복했다. 소현세자와 봉림대군, 많은 백성이 청으로 끌려갔다.'}
};
const CARD_IDS=Object.keys(CARDS);
/* 문제: a[0]이 정답 */

  c.restore();
}

function drawTile(g,ch,px,py,p,x,y){

  switch(ch){
   case '.':grass();break;
   case 'F':grass();for(let i=0;i<3;i++){const a=px+5+((h2(x+i,y*3)*22)|0),b=py+5+((h2(y+i,x*5)*22)|0);g.fillStyle=p.fl;g.fillRect(a,b,3,3);g.fillStyle='#fff6a0';g.fillRect(a+1,b+1,1,1);}break;
   case 'T':grass();g.fillStyle='#6b4a2a';g.fillRect(px+13,py+18,6,12);
     if(p===PAL.late){g.strokeStyle='#5a4630';g.lineWidth=2;g.beginPath();g.moveTo(px+16,py+20);g.lineTo(px+8,py+8);g.moveTo(px+16,py+18);g.lineTo(px+24,py+7);g.moveTo(px+16,py+16);g.lineTo(px+16,py+4);g.stroke();g.fillStyle=p.t2;g.beginPath();g.arc(px+16,py+10,6,0,7);g.fill();}
     else{g.fillStyle=p.t1;g.beginPath();g.arc(px+16,py+13,12,0,7);g.fill();g.fillStyle=p.t2;g.beginPath();g.arc(px+12,py+9,5.5,0,7);g.fill();if(p===PAL.winter){g.fillStyle='#fff';g.beginPath();g.arc(px+16,py+6,8,Math.PI,0);g.fill();}}break;
   case '=':g.fillStyle=p.road;g.fillRect(px,py,T,T);g.fillStyle='rgba(0,0,0,.07)';g.fillRect(px+((r*24)|0),py+((h2(y,x)*24)|0),4,3);break;
   case 'S':g.fillStyle=p.sand;g.fillRect(px,py,T,T);g.fillStyle='rgba(0,0,0,.06)';g.fillRect(px+((r*26)|0),py+((h2(y,x)*26)|0),3,2);break;
   case '~':g.fillStyle=p.water;g.fillRect(px,py,T,T);break;
   case 'D':g.fillStyle='#b98b55';g.fillRect(px,py,T,T);g.fillStyle='#8f6a3d';for(let i=0;i<4;i++)g.fillRect(px,py+i*8+7,T,1);break;
   case 'P':grass();g.strokeStyle='#c9b36b';g.lineWidth=2;for(let i=0;i<5;i++){const a=px+3+i*6;g.beginPath();g.moveTo(a,py+30);g.lineTo(a+2,py+8+((h2(x+i,y)*6)|0));g.stroke();}break;
   case 'W':g.fillStyle='#8d8f94';g.fillRect(px,py,T,T);g.fillStyle='#a6a9ae';for(let j=0;j<4;j++)for(let i=0;i<2;i++)g.fillRect(px+i*16+(j%2?8:0)-((j%2&&i)?0:0),py+j*8+1,14,6);g.fillStyle='#6f7175';g.fillRect(px,py,T,3);break;
   case 'G':g.fillStyle=p.road;g.fillRect(px,py,T,T);g.fillStyle='#5b4632';g.fillRect(px,py,4,T);g.fillRect(px+28,py,4,T);break;
   case 'R':grass();g.fillStyle='#8a8a86';g.beginPath();g.ellipse(px+16,py+20,13,9,0,0,7);g.fill();g.fillStyle='#a9a9a4';g.beginPath();g.ellipse(px+12,py+16,6,4,0,0,7);g.fill();break;
  }

    g.fillStyle='#c94a3a';g.beginPath();g.moveTo(x+w/2,y+4);g.lineTo(x+w/2-10,y+h-4);g.lineTo(x+w/2+10,y+h-4);g.fill();

    g.fillStyle='#a27445';g.fillRect(x+20,y+h*.22,w-40,h*.25);g.fillStyle='#5a3a20';for(let i=x+26;i<x+w-24;i+=14)g.fillRect(i,y+h*.28,6,6);

function buildMap(m){
  m.block=new Set();for(const b of m.bld)for(let j=b.y;j<b.y+b.h;j++)for(let i=b.x;i<b.x+b.w;i++)m.block.add(i+','+j);
  const c=document.createElement('canvas');c.width=W;c.height=ROWS*T;const g=c.getContext('2d');const p=PAL[m.season];
  const base=m.g.map(r=>r.slice());
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)drawTile(g,base[y][x],x*T,y*T,p,x,y);
  m.water=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(base[y][x]==='~')m.water.push([x,y]);
  for(const b of m.bld)drawBld(g,b);
  m.layer=c;return m;
}

    PNL.querySelectorAll('.opt').forEach((b,k)=>{if(opts[k].ok)b.classList.add('ok');else if(k===i)b.classList.add('bad');});

    talk(steps,()=>{eff(sp.e);if(sp.herb&&S.items.includes('약초'))eff({인정:1});finish();});}
  else if(sp.k==='c'){talk([['',head+sp.t],{who:'p',t:'어떻게 할까?',c:sp.c.map(o=>({t:o.t,e:o.e}))}],finish);}
  else if(sp.k==='s'){const st=sp.t.map((t,i)=>['',(i?'':'⚡ 역사의 소용돌이! '+head)+t]);talk(st,()=>{if(sp.card)showCard(sp.card,()=>askCardQ(sp.card,finish));else finish();});}
  else if(sp.k==='q'){quizSpace();}
  else if(sp.k==='m'||sp.k==='e'){enterChapter(sp.ch);}
  else finish();
}
function quizSpace(){
  let pool=[];for(const c of S.cards)QB[c].forEach((q,i)=>{if(!S.asked.includes(c+'-'+i))pool.push([c,i]);});
  if(pool.length<2)for(const c of(S.cards.length?S.cards:CARD_IDS))QB[c].forEach((q,i)=>pool.push([c,i]));
  pool=shuffle(pool).slice(0,2);
  const askOne=(j)=>{if(j>=pool.length)return finish();const [c,i]=pool[j];S.asked.push(c+'-'+i);mcq({title:`실록 퀴즈 (${j+1}/2)`,q:QB[c][i].q,a:QB[c][i].a,mode:'quiz',card:c},()=>askOne(j+1));};
  talk([['','📜 실록 칸! 지금까지 인생실록에 적은 내용을 확인해 보자.']],()=>askOne(0));
}
function drawBoard(t){
  const g=cx;const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#2a3550');bg.addColorStop(1,'#1d2433');g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle='#f3e6c6';g.fillRect(24,40,912,446);g.fillStyle='#e3d2a8';g.fillRect(24,40,912,8);g.fillRect(24,478,912,8);
  g.fillStyle='#8b5a2b';g.fillRect(14,34,16,458);g.fillRect(930,34,16,458);
  g.strokeStyle='#c9b48a';g.lineWidth=10;g.lineJoin='round';g.beginPath();SP.forEach((s,i)=>{const[x,y]=cellXY(i);i?g.lineTo(x+64,y+30):g.moveTo(x+64,y+30);});g.stroke();
  SP.forEach((s,i)=>{const[x,y]=cellXY(i);const past=i<S.pos;
    g.globalAlpha=past?.55:1;g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x+3,y+4,128,60);g.fillStyle=SPC[s.k];g.fillRect(x,y,128,60);
    g.strokeStyle=i===S.pos?'#fff':'rgba(0,0,0,.25)';g.lineWidth=i===S.pos?4:2;g.strokeRect(x,y,128,60);
    g.fillStyle='#2b2218';g.font='12px "Gowun Dodum",sans-serif';g.fillText(`${s.y}년 · ${s.a}세`,x+6,y+15);
    g.font='17px Jua,sans-serif';g.fillText(s.l,x+6,y+38);g.font='11.5px "Gowun Dodum",sans-serif';g.fillStyle='rgba(43,34,24,.75)';g.fillText(SPN[s.k],x+6,y+54);
    if(STOP[s.k]){g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.arc(x+116,y+12,7,0,7);g.fill();g.fillStyle='#c0392b';g.font='bold 11px sans-serif';g.fillText('!',x+114,y+16);}
    if(s.card&&S.cards.includes(s.card)){g.fillStyle='#fff8';g.fillRect(x+96,y+38,26,18);g.fillStyle='#8b6b3f';g.font='11px Jua';g.fillText('카드',x+98,y+51);}
    g.globalAlpha=1;});
  const[x,y]=cellXY(S.pos);const hp=Math.min(1,(performance.now()-hopT)/280);const hop=Math.sin(hp*Math.PI)*16;
  drawChar(g,x+58,y-6-hop,pchar(),'down',0,1.25);
  const done=S.done[S.pos];if(done&&!rolling&&!locked()&&scene==='board'){g.fillStyle='rgba(255,255,255,'+(.5+.5*Math.sin(t*4))+')';g.font='14px Jua,sans-serif';g.fillText('▼ 주사위를 굴려요',x+16,y+80>520?y-30:y+80);}
}

/* ================= 2D 맵 ================= */
let MAP=null;const PL={x:0,y:0,tx:0,ty:0,t:0,mv:false,dir:'up',step:0,path:[],pend:null};
const DX={up:0,down:0,left:-1,right:1},DY={up:-1,down:1,left:0,right:0};
const held={};
function enterChapter(id){
  const ch=CHAPTERS[id];
  fade(()=>{
    const m=buildMap(ch.map());MAP={id,ch,m,npcs:ch.npcs.map(n=>Object.assign({dir:'down'},n)),done:false,talked:{}};
    PL.x=PL.tx=ch.start[0];PL.y=PL.ty=ch.start[1];PL.mv=false;PL.t=0;PL.dir='up';PL.path=[];PL.pend=null;
    scene='map';BBAR.classList.add('hidden');if(COARSE)PAD.classList.remove('hidden');hud();
    chapterTitle(`${ch.name} · ${ch.year}`,ch.place);
    setTimeout(()=>talk(ch.intro()),1300);
  });
}
function walkable(x,y){if(!MAP||x<0||y<0||x>=COLS||y>=ROWS)return false;const ch=MAP.m.g[y][x];if(BLOCK[ch])return false;if(MAP.m.block.has(x+','+y))return false;if(MAP.npcs.some(n=>n.x===x&&n.y===y))return false;return true;}
function npcAt(x,y){return MAP.npcs.find(n=>n.x===x&&n.y===y);}
function locked(){return fading||!DLG.classList.contains('hidden')||pOpen();}
function bfs(sx,sy,goal){
  const prev=new Map(),q=[[sx,sy]],key=(x,y)=>x+','+y;prev.set(key(sx,sy),null);
  while(q.length){const[x,y]=q.shift();if(goal(x,y)){const path=[];let k=key(x,y);while(k&&k!==key(sx,sy)){const[a,b]=k.split(',').map(Number);path.unshift([a,b]);k=prev.get(k);}return path;}
    for(const d of['up','down','left','right']){const nx=x+DX[d],ny=y+DY[d],k=key(nx,ny);if(!prev.has(k)&&walkable(nx,ny)){prev.set(k,key(x,y));q.push([nx,ny]);}}}
  return null;
}
function interact(){
  if(!MAP||locked()||PL.mv)return;const n=npcAt(PL.x+DX[PL.dir],PL.y+DY[PL.dir]);if(n)talkNpc(n);
}
function faceTo(n){if(n.x<PL.x)PL.dir='left';else if(n.x>PL.x)PL.dir='right';else if(n.y<PL.y)PL.dir='up';else PL.dir='down';
  n.dir=PL.dir==='left'?'right':PL.dir==='right'?'left':PL.dir==='up'?'down':'up';}
function talkNpc(n){
  faceTo(n);
  if(n.main&&!MAP.done){
    const ch=MAP.ch;
    talk(ch.pre(),()=>runMission(ch.mission,score=>{
      if(MAP.id!=='E')S.miss[MAP.id]=score;hud();
      talk(ch.post(),()=>{
        MAP.done=true;hud();
        const back=()=>{if(MAP.id==='E'){S.done[S.pos]=true;S.fin=true;save();showResult();return;}
          talk([['','인생실록에 새 페이지가 채워졌다. 이제 인생 보드로 돌아가자.']],()=>{S.done[S.pos]=true;save();enterBoard(true);});};
        if(ch.card)showCard(ch.card,back);else back();
      });
    }));
  }else if(n.main&&MAP.done){talk([[n.id,'고맙구나. 네가 겪은 일을 잊지 말고 적어 두어라.']]);}
  else talk(n.say);
}
function heldDir(){for(const d of['up','down','left','right'])if(held[d])return d;return null;}
function updMap(dt){
  if(!MAP)return;
  if(PL.mv){PL.t+=dt*6.5;if(PL.t>=1){PL.x=PL.tx;PL.y=PL.ty;PL.mv=false;PL.t=0;PL.step++;}}
  if(PL.mv||locked())return;
  let d=heldDir(),target=null;
  if(d)PL.path=[],PL.pend=null;
  else if(PL.path.length){const[nx,ny]=PL.path[0];d=nx<PL.x?'left':nx>PL.x?'right':ny<PL.y?'up':'down';target=[nx,ny];}
  if(d){PL.dir=d;const nx=PL.x+DX[d],ny=PL.y+DY[d];if(walkable(nx,ny)){PL.tx=nx;PL.ty=ny;PL.mv=true;if(target)PL.path.shift();}else PL.path=[];return;}
  if(PL.pend){const n=PL.pend;PL.pend=null;if(Math.abs(n.x-PL.x)+Math.abs(n.y-PL.y)===1)talkNpc(n);}
}
function drawMap(t){
  const g=cx;g.fillStyle='#000';g.fillRect(0,0,W,H);g.drawImage(MAP.m.layer,0,OY);
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.5;
  for(const[x,y]of MAP.m.water){const ph=(t*1.2+x*.7+y*.4)%2;if(ph<1.2){const px=x*T+6+((x*13+y*7)%14),py=OY+y*T+10+((x*5+y*11)%14);g.beginPath();g.arc(px,py,4,Math.PI*1.1,Math.PI*1.9);g.stroke();}}
  const ents=MAP.npcs.map(n=>({y:n.y,f:()=>{drawChar(g,n.x*T,OY+n.y*T-4+(Math.sin(t*2+n.x)>.85?-1:0),CH[n.id].o,n.dir,0,1);
    if(n.main&&!MAP.done){const by=OY+n.y*T-26+Math.sin(t*5)*3;g.fillStyle='#ffd76a';g.beginPath();g.arc(n.x*T+16,by,9,0,7);g.fill();g.strokeStyle='#4a3a28';g.lineWidth=2;g.stroke();g.fillStyle='#4a3a28';g.font='bold 14px sans-serif';g.textAlign='center';g.fillText('!',n.x*T+16,by+5);g.textAlign='left';}
    g.font='11px "Gowun Dodum",sans-serif';const nm=CH[n.id].n;const w=g.measureText(nm).width+8;g.fillStyle='rgba(0,0,0,.45)';g.fillRect(n.x*T+16-w/2,OY+n.y*T+28,w,14);g.fillStyle='#fff';g.textAlign='center';g.fillText(nm,n.x*T+16,OY+n.y*T+39);g.textAlign='left';}}));
  const px=(PL.x+(PL.tx-PL.x)*PL.t)*T,py=(PL.y+(PL.ty-PL.y)*PL.t)*T;
  ents.push({y:PL.mv?Math.max(PL.y,PL.ty):PL.y,f:()=>drawChar(g,px,OY+py-4,pchar(),PL.dir,PL.mv?(PL.step+(PL.t>.5?1:0)):0,1)});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  if(MAP.m.season==='winter'){g.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<60;i++){const x=(i*97+t*20*(1+i%3))%W,y=(i*53+t*40*(1+i%2))%H;g.fillRect(x,y,2,2);}}
  if(MAP.m.season==='autumn'){g.fillStyle='rgba(230,120,40,.7)';for(let i=0;i<18;i++){const x=(i*131+t*25)%W,y=(i*71+t*35)%H;g.fillRect(x,y,3,2);}}
  if(MAP.m.season==='spring'){g.fillStyle='rgba(255,190,210,.8)';for(let i=0;i<16;i++){const x=(i*149+t*18)%W,y=(i*67+t*28)%H;g.fillRect(x,y,3,3);}}
}
function canvasTap(e){
  if(scene!=='map'||locked())return;
  const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*W/T),y=Math.floor(((e.clientY-r.top)/r.height*H-OY)/T);
  if(x<0||y<0||x>=COLS||y>=ROWS)return;
  const n=npcAt(x,y);
  if(n){if(Math.abs(n.x-PL.x)+Math.abs(n.y-PL.y)===1&&!PL.mv){talkNpc(n);return;}const p=bfs(PL.x,PL.y,(a,b)=>Math.abs(a-n.x)+Math.abs(b-n.y)===1);if(p){PL.path=p;PL.pend=n;}return;}
  const p=bfs(PL.x,PL.y,(a,b)=>a===x&&b===y);if(p){PL.path=p;PL.pend=null;}
}
cv.addEventListener('pointerdown',canvasTap);

/* ================= 타이틀 배경 ================= */
function drawTitle(t){
  const g=cx;const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#f7c98b');sky.addColorStop(.55,'#f3e2c0');sky.addColorStop(1,'#cfe0c0');g.fillStyle=sky;g.fillRect(0,0,W,H);
  g.fillStyle='#e9764a';g.beginPath();g.arc(760,150,58,0,7);g.fill();
  const hill=(col,base,amp,f,o)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=20)g.lineTo(x,base-Math.sin(x*f+o)*amp-Math.sin(x*f*2.3+o)*amp*.4);g.lineTo(W,H);g.fill();};
  hill('#9fb89a',300,50,.006,1);hill('#7d9c78',350,40,.009,3);hill('#5e7f5a',410,30,.012,5);
  roofCurve(g,90,330,260,70,'#3b3f48');g.fillStyle='#efe6d2';g.fillRect(110,400,220,80);g.fillStyle='#7a4a2a';for(let i=0;i<5;i++)g.fillRect(114+i*52,400,6,80);
  for(let i=0;i<4;i++){const x=600+i*70,y=440+Math.sin(t+i)*2;g.fillStyle='#4e9a45';g.beginPath();g.arc(x,y,26,0,7);g.fill();}
  g.fillStyle='rgba(255,190,210,.85)';for(let i=0;i<24;i++){const x=(i*149+t*22)%W,y=(i*67+t*30)%H;g.fillRect(x,y,4,3);}
}

/* ================= 결과 ================= */
function ending(){
  const s=S.st;
  if(S.cards.length>=12&&S.tl===8)return['인생실록을 남긴 이야기꾼','『인생실록』의 모든 페이지를 채우고 역사의 흐름까지 정리했습니다. 당신의 기록은 손주에게, 그리고 먼 훗날의 우리에게 전해졌습니다.'];
  if(S.path==='의병'&&s.용기>=s.지혜&&s.용기>=s.인정)return['홍의장군의 전령','곽재우의 의병과 함께 산과 강을 누비며 소식을 전했습니다. 백성 스스로 나라를 지킬 수 있다는 것을 몸으로 보여 준 삶이었습니다.'];
  if(S.path==='수군'&&(s.용기+s.지혜)>=s.인정)return['바다를 지킨 격군','이순신 장군의 판옥선에서 노를 저으며 바다를 지켰습니다. 바다를 지킨 덕분에 많은 백성이 곡식과 목숨을 지킬 수 있었습니다.'];
  if(S.path==='의원'&&s.인정>=s.용기&&s.인정>=s.지혜)return['백성을 살린 의원','전쟁터와 피란길에서 다친 사람을 돌보고, 허준을 도와 백성을 살리는 일에 평생을 바쳤습니다.'];
  return['이웃과 함께 버틴 백성','두 번의 큰 전쟁 속에서도 이웃과 곡식을 나누며 끝까지 삶을 지켜 냈습니다. 나라를 지킨 것은 이름 없는 백성들이기도 했습니다.'];
}
function showResult(){
  fade(()=>{scene='board';MAP=null;PAD.classList.add('hidden');BBAR.classList.add('hidden');hud();
  const[en,et]=ending();const m=Object.values(S.miss).reduce((a,b)=>a+b,0),bonus=(S.st.용기+S.st.지혜+S.st.인정)*5,mx=Math.max(8,S.st.용기,S.st.지혜,S.st.인정);
  openP(`<div style="text-align:center"><h2 style="font-size:32px">${S.name}의 인생실록</h2><p style="font-size:16px;color:#8b6b3f">1580년 동래 출생 · 1637년 57세</p>
   <div class="card" style="text-align:center;margin:8px 0"><div class="yr">엔딩 칭호</div><h3>${en}</h3><p>${et}</p></div></div>
   <div style="display:flex;gap:18px"><div style="flex:1"><table class="bk"><tr><td>장 미션 (${Object.keys(S.miss).length}/7)</td><td>${m}점</td></tr><tr><td>실록 퀴즈 (${S.qc}/${S.qt} 정답)</td><td>${S.qs}점</td></tr><tr><td>연표 완성 (${S.tl}/8)</td><td>${S.tl*10}점</td></tr><tr><td>능력치 보너스</td><td>${bonus}점</td></tr><tr><td><b>총점</b></td><td style="color:#d9613b;font-size:24px">${total()}점</td></tr></table></div>
   <div style="flex:1" class="bars">${['용기','지혜','인정'].map(k=>`<div><span style="width:40px">${k}</span><span class="bar"><i style="width:${Math.min(100,S.st[k]/mx*100)}%"></i></span><b>${S.st[k]}</b></div>`).join('')}<div><span style="width:40px">곡식</span><b>${S.st.곡식}</b></div>
   <p style="font-size:16px;margin-top:6px">실록 카드 <b>${S.cards.length}/12</b></p></div></div>
   <div class="mini">${CARD_IDS.map(id=>`<span class="${S.cards.includes(id)?'got':''}">${CARDS[id].t}</span>`).join('')}</div>
   <p style="text-align:center;font-size:15px;color:#8b6b3f">이 화면을 캡처해 제출하세요.</p>
   <div class="row"><button class="btn sub" id="r1">실록 카드 다시 보기</button>${S.wrong.length?'<button class="btn sub" id="r2">틀린 사건 다시 보기</button>':''}<button class="btn" id="r3">처음부터</button></div>`);
  on('#r1',()=>cardList(S.cards,'나의 실록 카드'));on('#r2',()=>cardList(S.wrong,'틀린 사건 다시 보기'));on('#r3',()=>{clearSave();S=newState();titleScreen();});
  });
}
function cardList(ids,title){
  openP(`<h2>${title}</h2>${ids.map(id=>`<div class="card" style="margin:8px 0"><div class="yr">${CARDS[id].y}</div><h3 style="font-size:22px">${CARDS[id].t}</h3><p style="font-size:17px">${CARDS[id].d}</p></div>`).join('')||'<p>아직 없어요.</p>'}<div class="row"><button class="btn" id="bk">결과로 돌아가기</button></div>`);
  on('#bk',showResult);
}

/* ================= 입력 ================= */
const KM={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(KM[k]){held[KM[k]]=true;e.preventDefault();}
  if(D.choice&&/^[1-4]$/.test(k)){pick(+k-1);e.preventDefault();return;}
  if(k===' '||k==='enter'){e.preventDefault();if(adv())return;if(pOpen())return;if(scene==='map')interact();else if(scene==='board')rollDice();}
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(KM[k])held[KM[k]]=false;});
addEventListener('blur',()=>{for(const k in held)held[k]=false;});
PAD.querySelectorAll('.dp button').forEach(b=>{const d=b.dataset.d;b.addEventListener('pointerdown',e=>{e.preventDefault();held[d]=true;});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>held[d]=false));});
$('#padA').addEventListener('pointerdown',e=>{e.preventDefault();if(adv())return;interact();});
$('#roll').addEventListener('click',rollDice);

/* ================= 루프 ================= */
function loop(ts){const dt=Math.min(.05,(ts-lastTS)/1000||0);lastTS=ts;if(COARSE)PAD.classList.toggle('hidden',!(scene==='map'&&MAP&&!locked()));try{if(scene==='map'&&MAP){updMap(dt);drawMap(ts/1000);}else if(scene==='board')drawBoard(ts/1000);else drawTitle(ts/1000);}catch(err){console.error(err);}requestAnimationFrame(loop);}
titleScreen();requestAnimationFrame(loop);
</script>
